services:
  app:
    image: bysages/lens:latest
    restart: unless-stopped
    # Host networking keeps real client IPs for rate limiting (Linux hosts;
    # on Docker Desktop switch to ports: "${PORT:-3000}:3000" instead)
    network_mode: host
    # init reaps orphaned processes and forwards signals (Moli runs alongside Node)
    init: true
    mem_limit: ${APP_MEMORY_LIMIT:-1400m}
    memswap_limit: ${APP_MEMORY_LIMIT:-1400m}
    environment:
      # Node Environment
      NODE_ENV: production
      PORT: ${PORT:-3000}
      # Image Proxy Security
      ALLOWED_DOMAINS: ${ALLOWED_DOMAINS:-}
      # Set TRUST_PROXY=1 only when requests arrive through a trusted reverse proxy
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Caching: LRU-evicted and shared across cluster workers
      REDIS_URL: ${REDIS_URL:-redis://127.0.0.1:6379}
      # Two workers handle I/O-heavy proxy work without six full app runtimes.
      # Browser permits are cluster-wide when Redis is available.
      NITRO_CLUSTER_WORKERS: ${NITRO_CLUSTER_WORKERS:-2}
      BROWSER_MAX_CONCURRENCY: ${BROWSER_MAX_CONCURRENCY:-4}
      BROWSER_QUEUE_TIMEOUT: ${BROWSER_QUEUE_TIMEOUT:-15000}
      SCREENSHOT_MAX_PIXELS: ${SCREENSHOT_MAX_PIXELS:-24000000}
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=384}
      XDG_CACHE_HOME: ${XDG_CACHE_HOME:-/tmp/lens-cache}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:${PORT:-3000}/healthz",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:alpine
    restart: unless-stopped
    # Bounded cache: evict least-recently-used keys instead of growing forever
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      # Loopback only: reachable by the host-networked app, invisible to the outside
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
